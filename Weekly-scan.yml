name: Minnesota Retail Vacancy Weekly Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run vacancy scanner
        run: python bot.py
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minnesota-vacancy-results
          path: data/
          if-no-files-found: ignore
