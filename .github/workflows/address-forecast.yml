name: Address forecast test
on:
  push:
    paths:
      - address_forecast.py
      - test_address_forecast.py
      - .github/workflows/address-forecast.yml
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest test_address_forecast.py -v
