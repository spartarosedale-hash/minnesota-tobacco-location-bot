name: Minnesota Retail Vacancy Weekly Scan

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/weekly-scan.yml'
      - 'city_discovery.py'
      - 'lead_enrichment.py'
      - 'source_verification.py'
      - 'test_page_extraction.py'
      - 'page_extraction.py'
      - 'lead_filter.py'
      - 'official_sources.py'
      - 'osm_city_discovery.py'
      - 'osm_extract.py'
      - 'test_osm_city_discovery.py'
      - 'test_lead_filter.py'
      - 'test_source_verification.py'
      - 'test_lead_enrichment.py'
      - 'research_cities.csv'
  schedule:
    - cron: '0 14 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt 'osmium>=4,<5'
      - name: Test automated lead enrichment
        run: python -m unittest test_lead_enrichment test_source_verification test_page_extraction test_lead_filter test_osm_city_discovery -v
      - name: Run vacancy scanner
        run: python bot.py
      - name: Download Minnesota OpenStreetMap extract
        run: |
          mkdir -p data
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 240 \
            --output data/minnesota.osm.pbf \
            https://download.geofabrik.de/north-america/us/minnesota-latest.osm.pbf || rm -f data/minnesota.osm.pbf
      - name: Automatically discover city retail and competitor leads
        run: python city_discovery.py
      - name: Remove large source extract
        if: always()
        run: rm -f data/minnesota.osm.pbf
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: minnesota-vacancy-results
          path: data/
          if-no-files-found: ignore
