name: Store Prediction Input Validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'store_predictor.py'
      - 'stores.csv'
      - '.github/workflows/store-prediction-test.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate store prediction inputs
        run: python store_predictor.py
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: store-prediction-validation
          path: data/store_predictions.csv
