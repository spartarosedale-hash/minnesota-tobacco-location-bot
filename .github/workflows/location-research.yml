name: Location research refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1"
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check location feature registry
        run: python -m unittest -v test_location_feature_registry test_audit_location_evidence test_location_estimate test_census_location test_demographic_fields
      - name: Refresh Census demographic evidence
        id: census
        continue-on-error: true
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          python collect_location_demographics.py --output research_demographics.json
      - name: Collect nearby MnDOT traffic segments
        id: traffic
        continue-on-error: true
        run: python collect_mndot_traffic.py --output research_traffic.json
      - name: Audit evidence and holdout prediction errors
        if: steps.census.outcome == 'success' && steps.traffic.outcome == 'success'
        run: python audit_location_evidence.py --output location_evidence_audit.json
      - name: Compare observed store performance
        if: steps.census.outcome == 'success' && steps.traffic.outcome == 'success'
        run: python compare_store_performance.py --output store_comparison_report.json
      - name: Report source statuses
        if: always()
        run: |
          echo "Census outcome: ${{ steps.census.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "MnDOT outcome: ${{ steps.traffic.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.census.outcome }}" != "success" ] || [ "${{ steps.traffic.outcome }}" != "success" ]; then
            echo "::warning::One or more data collectors failed. Inspect their step logs and downloaded artifacts."
          fi
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: location-research
          path: |
            research_demographics.json
            research_traffic.json
            location_evidence_audit.json
            store_comparison_report.json
          if-no-files-found: ignore
