name: Location research refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1"
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check location feature registry
        run: python -m unittest -v test_location_feature_registry
      - name: Refresh Census demographic evidence
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          python collect_location_demographics.py --output research_demographics.json
      - name: Collect nearby MnDOT traffic segments
        run: python collect_mndot_traffic.py --output research_traffic.json
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: location-research
          path: |
            research_demographics.json
            research_traffic.json
          if-no-files-found: ignore
