name: Zimmerman free live source validation
on:
  push:
    paths:
      - .github/workflows/zimmerman-live-check.yml
      - zimmerman_live_check.py
      - address_forecast.py
      - traffic_and_competition.py
      - free_places.py
      - site_report.py
  workflow_dispatch:
  schedule:
    - cron: '15 14 * * 1'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Test free source modules
        run: python -m unittest test_address_forecast test_traffic_and_competition test_google_popular_times -v
      - name: Check real Zimmerman sources
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python zimmerman_live_check.py
      - name: Save result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zimmerman-live-source-report
          path: zimmerman_live_report.json
          if-no-files-found: warn
